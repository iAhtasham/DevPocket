ShortDescription: A growing collection of small, single-purpose dev tools (freeport, adbshot, zipper).
Description: >-
  DevPocket is a growing collection of small, single-purpose dev tools.
  Installing it puts freeport, adbshot, and zipper on your PATH.
  freeport frees a TCP port by killing whatever process is listening on it.
  adbshot captures a screenshot from a connected ADB (Android) device
  straight to the clipboard. zipper zips a folder while skipping junk
  like node_modules, bin, and dist.
Moniker: devpocket
Tags:
  - freeport
  - adb
  - screenshot
  - zip
  - cli
  - developer-tools
ReleaseNotes: Initial release with freeport, adbshot, and zipper.
